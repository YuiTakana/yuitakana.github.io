<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yui Tanaka | Graphic Designer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="landing-page">
    <!-- Slideshow Background -->
    <div class="slideshow-container">
      <div class="slide fade" data-brightness="dark" style="background-image: url('Images/inui-live1.jpg')"></div>
      <div class="slide fade" data-brightness="dark" style="background-image: url('Images/inui-live2.jpg')"></div>
      <div class="slide fade" data-brightness="light" style="background-image: url('Images/shizuoka-ws.jpg')"></div>
      <div class="slide fade" data-brightness="dark" style="background-image: url('https://images.unsplash.com/photo-1525182008055-f88b95ff7980?auto=format&fit=crop&w=1200&q=80')"></div>
      <div class="slide fade" data-brightness="dark" style="background-image: url('https://images.unsplash.com/photo-1512436991641-6745cdb1723f?auto=format&fit=crop&w=1200&q=80')"></div>
      <div class="slide fade" data-brightness="dark" style="background-image: url('https://images.unsplash.com/photo-1497366811353-6870744d04b2?auto=format&fit=crop&w=1200&q=80')"></div>
    </div>

    <!-- Fixed Header: Logo + Navigation -->
    <header class="landing-header">
      <div class="landing-logo">
        <a href="landing.html" class="landing-logo-link">
          <img src="Images/yui_logo.png" alt="Logo" class="landing-logo-img" />
          <span>Yui Tanaka</span>
        </a>
      </div>

      <nav class="landing-nav">
        <a href="index.html" class="landing-nav-item">Works</a>
        <a href="index.html#about" class="landing-nav-item">About</a>
        <a href="index.html#contact" class="landing-nav-item">Contact</a>
      </nav>
    </header>
  </div>

  <script src="landing.js"></script>
</body>
</html>
